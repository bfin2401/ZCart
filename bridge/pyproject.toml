[project]
name = "studio-bridge"
version = "0.1.0"
description = "Local HTTP bridge: Godox Bluetooth Mesh lights and Audient EVO 8 control for Bitfocus Companion"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# The Godox mesh library is not on PyPI; install/install.sh installs it from
# its GitHub tag. Listed here for reference only.
libusb = ["pyusb>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
studio-bridge = "studio_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["studio_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
